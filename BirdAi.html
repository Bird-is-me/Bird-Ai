<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bird AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

#app{
    width:100%;
    max-width:850px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
}

header{
    padding:16px;
    border-bottom:1px solid #333;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:22px;
    font-weight:bold;
}

#settings{
    background:#222;
    border:1px solid #444;
    color:white;
    border-radius:10px;
    padding:8px 12px;
    cursor:pointer;
}

#config{
    display:none;
    padding:12px;
    background:#191919;
    border-bottom:1px solid #333;
}

#config input{
    width:100%;
    margin:5px 0;
    padding:12px;
    border:1px solid #444;
    border-radius:8px;
    background:#222;
    color:white;
    outline:none;
}

#save{
    margin-top:5px;
    padding:10px 15px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

#status{
    padding:7px 15px;
    color:#888;
    font-size:13px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.msg{
    max-width:85%;
    margin:10px 0;
    padding:13px 15px;
    border-radius:15px;
    white-space:pre-wrap;
    line-height:1.5;
    animation:messageIn .25s ease;
}

.user{
    margin-left:auto;
    background:#333;
}

.ai{
    margin-right:auto;
    background:#242424;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Loading */

.loading{
    display:flex;
    align-items:center;
    gap:6px;
    color:#aaa;
}

.loading-text{
    font-size:14px;
}

.dot{
    width:6px;
    height:6px;
    background:#aaa;
    border-radius:50%;
    animation:dotLoading 1.4s infinite ease-in-out;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}

@keyframes dotLoading{
    0%,80%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    40%{
        opacity:1;
        transform:translateY(-4px);
    }
}

/* Input */

#bar{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid #333;
}

#input{
    flex:1;
    min-width:0;
    padding:14px;
    border:1px solid #333;
    outline:none;
    border-radius:12px;
    background:#292929;
    color:white;
    font-size:15px;
}

#send{
    border:0;
    border-radius:12px;
    padding:0 18px;
    font-weight:bold;
    cursor:pointer;
}

#send:disabled{
    opacity:.5;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="title">🐦 Bird AI</div>

    <button id="settings">
        ⚙
    </button>
</header>

<div id="config">

    <input
        id="apiKey"
        type="password"
        placeholder="Gemini API Key"
    >

    <input
        id="model"
        type="text"
        value="gemini-2.5-flash"
        placeholder="Model"
    >

    <button id="save">
        Save
    </button>

</div>

<div id="status">
    Ready
</div>

<div id="chat"></div>

<div id="bar">

    <input
        id="input"
        type="text"
        placeholder="Ask Bird AI..."
        autocomplete="off"
    >

    <button id="send">
        Send
    </button>

</div>

</div>

<script>

const apiKeyInput =
    document.getElementById("apiKey");

const modelInput =
    document.getElementById("model");

const settings =
    document.getElementById("settings");

const config =
    document.getElementById("config");

const save =
    document.getElementById("save");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("send");

const status =
    document.getElementById("status");

let history = [];


/* =========================
   LOAD SETTINGS
========================= */

apiKeyInput.value =
    localStorage.getItem("bird_api_key") || "";

modelInput.value =
    localStorage.getItem("bird_model") ||
    "gemini-2.5-flash";


/* =========================
   SETTINGS
========================= */

settings.onclick = () => {

    if(config.style.display === "block"){

        config.style.display = "none";

    }else{

        config.style.display = "block";

    }

};


/* =========================
   SAVE
========================= */

save.onclick = () => {

    localStorage.setItem(
        "bird_api_key",
        apiKeyInput.value.trim()
    );

    localStorage.setItem(
        "bird_model",
        modelInput.value.trim()
    );

    status.textContent =
        "Model + API Key saved";

    config.style.display =
        "none";

};


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

    const div =
        document.createElement("div");

    div.className =
        "msg " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

    return div;
}


/* =========================
   LOADING MESSAGE
========================= */

function addLoading(){

    const div =
        document.createElement("div");

    div.className =
        "msg ai";

    div.innerHTML = `
        <div class="loading">

            <span class="loading-text">
                Bird AI is thinking
            </span>

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>
    `;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

    return div;
}


/* =========================
   SEND
========================= */

async function send(){

    const text =
        input.value.trim();

    if(!text) return;


    const API_KEY =
        apiKeyInput.value.trim();

    const MODEL =
        modelInput.value.trim();


    if(!API_KEY){

        addMessage(
            "❌ Please enter your Gemini API Key.",
            "ai"
        );

        config.style.display =
            "block";

        return;
    }


    if(!MODEL){

        addMessage(
            "❌ Please enter a model.",
            "ai"
        );

        return;
    }


    addMessage(
        text,
        "user"
    );

    input.value = "";

    input.disabled = true;

    sendButton.disabled = true;

    status.textContent =
        "Bird AI is thinking...";


    const loadingMessage =
        addLoading();


    history.push({

        role:"user",

        parts:[
            {
                text:text
            }
        ]

    });


    try{

        const API_URL =
            "https://generativelanguage.googleapis.com/v1beta/models/"
            + encodeURIComponent(MODEL)
            + ":generateContent";


        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "x-goog-api-key":
                            API_KEY
                    },

                    body:JSON.stringify({

                        systemInstruction:{
                            parts:[
                                {
                                    text:
                                    "You are Bird AI. " +
                                    "Give clear, helpful and accurate answers. " +
                                    "Always respond in English unless the user asks for another language."
                                }
                            ]
                        },

                        contents:history,

                        generationConfig:{
                            temperature:0.7,
                            maxOutputTokens:2048
                        }

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            console.error(data);

            throw new Error(
                data?.error?.message ||
                "API request failed."
            );

        }


        const answer =
            data
            ?.candidates?.[0]
            ?.content?.parts
            ?.map(
                part => part.text || ""
            )
            .join("")
            .trim();


        if(!answer){

            throw new Error(
                "The model did not return a response."
            );

        }


        loadingMessage.remove();


        addMessage(
            answer,
            "ai"
        );


        history.push({

            role:"model",

            parts:[
                {
                    text:answer
                }
            ]

        });


        status.textContent =
            "Ready";


    }catch(error){

        console.error(error);

        loadingMessage.remove();

        addMessage(
            "❌ API Error:\n\n" +
            error.message,
            "ai"
        );

        status.textContent =
            "API Error";

        history.pop();

    }finally{

        input.disabled =
            false;

        sendButton.disabled =
            false;

        input.focus();

    }

}


/* =========================
   EVENTS
========================= */

sendButton.onclick =
    send;


input.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            send();

        }

    }
);


/* =========================
   START
========================= */

addMessage(
    "Hello! I am Bird AI 🐦\n\n" +
    "Open ⚙ to enter your Gemini API Key and select a model.",
    "ai"
);

</script>

</body>
</html>
